name: Release mod

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Read mod version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          if [[ -z "$version" || "$version" == *[![:alnum:]._-]* ]]; then
            echo "mod_version is missing or contains unsafe characters" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle wrapper
        run: ./gradlew clean check build --no-daemon --console=plain

      - name: Prepare versioned release asset
        shell: bash
        run: cp "build/libs/lemmecuttrees-${{ steps.version.outputs.version }}.jar" \
          "lemmecuttrees-v${{ steps.version.outputs.version }}.jar"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "lemmecuttrees-v${{ steps.version.outputs.version }}.jar" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LemmeCutTrees v${{ steps.version.outputs.version }}" \
            --generate-notes
